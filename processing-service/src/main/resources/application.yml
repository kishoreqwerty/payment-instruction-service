spring:
  application:
    name: processing-service
  lifecycle:
    # Paired with server.shutdown: graceful below and Kubernetes'
    # terminationGracePeriodSeconds: 60 (.notes/ARCHITECTURE.md §7.1): on
    # SIGTERM, stop accepting new work but let what's in flight finish --
    # both the web server's own in-flight requests (there are normally none,
    # this service has no REST API of its own) and, more importantly,
    # Spring Kafka's own listener container shutdown (SmartLifecycle stop,
    # on by default), which needs time to finish the in-flight record each
    # container thread is mid-way through before the process actually exits.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://localhost:5432/payments?stringtype=unspecified
    username: payments
    password: payments
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (core's migrations plus this service's own V2__refdata_schema.sql)
      # is the sole owner of the schema -- see intake-service's application.yml
      # for why "validate" is skipped too.
      ddl-auto: none
  flyway:
    enabled: true
    # No locations override: the default (classpath:db/migration) merges
    # core's bundled migration with this service's own V2 migration from the
    # same classpath location, ordered by version number.
    #
    # `schemas: refdata` puts this service's own flyway_schema_history in
    # its own schema rather than the shared `public` default -- see
    # intake-service's application.yml for the full reasoning (the V2
    # collision this fixes) and .notes/reports/CROSS-SERVICE-INTEGRATION-DEFECTS.md.
    schemas: refdata
    # See intake-service's application.yml for the full reasoning: harmless
    # when not needed, and defends this service too against the same class
    # of shared-schema start-order race if one is ever introduced here.
    baseline-on-migrate: true

payments:
  kafka:
    bootstrap-servers: localhost:29092
    consumer-group: processing-service
    received-partitions: 12
    validated-partitions: 12
    enriched-partitions: 12
    repaired-partitions: 6
    dlq-topic: payments.dlq
    dlq-partitions: 3
  outbox:
    batch-size: 100
    known-topics: payments.validated,payments.enriched,payments.routed,payments.exceptions
    retention: 7d
    retention-batch-size: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db,kafka
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

# A single server.port, not a separate management.server.port with
# spring.main.web-application-type: none -- that combination was found not
# to reliably start an embedded server at all in this Spring Boot version,
# confirmed directly (Part 3, .notes/reports/PHASE-12-REPORT.md section 9):
# even with spring-boot-starter-web added, Spring Boot never logged a
# Tomcat startup and the actuator port never opened. This service has no
# REST API of its own, but running it as a plain, single-port Spring Boot
# web application -- the same proven-reliable shape as the other three
# services -- is simpler and safer than the two-context split.
server:
  port: 8082
  shutdown: graceful
