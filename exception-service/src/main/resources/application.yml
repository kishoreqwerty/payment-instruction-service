server:
  port: 8084

spring:
  application:
    name: exception-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payments?stringtype=unspecified
    username: payments
    password: payments
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (core's migrations plus this service's own V2__exceptions_schema.sql)
      # is the sole owner of the schema.
      ddl-auto: none
  flyway:
    enabled: true
    # `schemas: exceptions` puts this service's own flyway_schema_history in
    # its own schema rather than the shared `public` default -- see
    # intake-service's application.yml for the full reasoning (the V2
    # collision this fixes) and .notes/reports/CROSS-SERVICE-INTEGRATION-DEFECTS.md.
    schemas: exceptions
    # See intake-service's application.yml for the full reasoning: harmless
    # when not needed, and defends this service too against the same class
    # of shared-schema start-order race if one is ever introduced here.
    baseline-on-migrate: true

payments:
  kafka:
    bootstrap-servers: localhost:29092
    consumer-group: exception-service
    exceptions-partitions: 6
    dlq-topic: payments.dlq
    dlq-partitions: 3
  outbox:
    batch-size: 100
    known-topics: payments.repaired
    retention: 7d
    retention-batch-size: 1000
  exceptions:
    # .notes/reports/PHASE-8-REPORT.md section 5 has the reasoning behind
    # three: cumulative across however many cases one instruction's repair
    # lineage spans (a bad repair opens a new case, but the count carries
    # forward -- see ExceptionCaseService), not reset per case.
    max-repair-attempts: 3
    # Comma-separated allowed CORS origins for the ops-dashboard (Phase 9).
    # The Vite dev server's default port locally; a real deployment would
    # override this with the dashboard's actual origin.
    dashboard-origins: http://localhost:5173

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
