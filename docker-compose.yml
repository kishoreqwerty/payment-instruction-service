services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      # Two listeners: "internal" is what other containers on this compose
      # network (redpanda-topics, redpanda-console, a containerized service)
      # resolve via the "redpanda" service name; "external" is what a
      # host-run process (e.g. `mvn spring-boot:run`) reaches via localhost.
      # A single advertised address can't serve both: whichever host name it
      # names, connections from the other side fail after the initial
      # metadata handshake once the client tries to follow the advertised
      # address.
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:29092
      # Off deliberately: auto-created topics get default partition counts,
      # which would silently break the per-instruction ordering the 12
      # partitions on payments.received are there to preserve. Topics are
      # created explicitly by the redpanda-topics init step below.
      - --set
      - redpanda.auto_create_topics_enabled=false
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot init step, not auto.create.topics.enable (see above). Exits
  # after creating both topics; `docker compose up` leaves it stopped.
  redpanda-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rpk topic create payments.received --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.validated --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.enriched --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.routed --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.sent --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.settled --partitions 12 --replicas 1 --brokers redpanda:9092 -c retention.ms=2592000000
        rpk topic create payments.exceptions --partitions 6 --replicas 1 --brokers redpanda:9092 -c retention.ms=2592000000
        rpk topic create payments.repaired --partitions 6 --replicas 1 --brokers redpanda:9092 -c retention.ms=604800000
        rpk topic create payments.dlq --partitions 3 --replicas 1 --brokers redpanda:9092 -c retention.ms=7776000000

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8090:8080"

  # Phase 10. Receives traces over OTLP HTTP (:4318) from every service -- see each
  # service's application.yml (management.otlp.tracing.endpoint). COLLECTOR_OTLP_ENABLED is
  # explicit rather than relied-upon-by-default since it varies by Jaeger version.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317" # OTLP gRPC (unused here, exposed for completeness)
      - "4318:4318" # OTLP HTTP -- what every service is actually configured to send to

  # Phase 10. Scrapes every service's /actuator/prometheus over host.docker.internal, since
  # the services themselves run on the host (see the redpanda service's own comment on the
  # internal/external listener split -- the whole stack follows that same shape: infra in
  # Compose, services via `mvn spring-boot:run` on the host). Also evaluates
  # observability/prometheus/alert_rules.yml.
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Phase 10. Provisioned as code, not clicked together: the datasource and all three
  # dashboards are version-controlled JSON under observability/grafana, mounted read-only and
  # loaded by Grafana's own provisioning mechanism on startup.
  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres-data:
