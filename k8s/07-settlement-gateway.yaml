apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-gateway-config
  namespace: payments
data:
  application-k8s.yaml: |
    spring:
      datasource:
        url: jdbc:postgresql://postgres:5432/payments?stringtype=unspecified
    payments:
      kafka:
        bootstrap-servers: redpanda:9092
      gateway:
        rail-base-urls:
          FEDWIRE: http://rail-simulator:8085
          SEPA: http://rail-simulator:8085
          ACH_EQUIV: http://rail-simulator:8085
    management:
      tracing:
        sampling:
          probability: 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-gateway
  namespace: payments
spec:
  # .notes/ARCHITECTURE.md §7.1 specifies 2 -- matched exactly here (no
  # local-capacity reduction needed at this replica count).
  replicas: 2
  selector:
    matchLabels:
      app: settlement-gateway
  template:
    metadata:
      labels:
        app: settlement-gateway
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: settlement-gateway
          image: payments/settlement-gateway:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: file:/config/application-k8s.yaml
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # See processing-service's startupProbe comment
          # (k8s/06-processing-service.yaml) for why this replaces a fixed
          # liveness initialDelaySeconds.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: settlement-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-gateway
  namespace: payments
spec:
  selector:
    app: settlement-gateway
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: settlement-gateway
  namespace: payments
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: settlement-gateway
