server:
  port: 8085

spring:
  application:
    name: rail-simulator

railsim:
  # Used only when a scenario sets neither statusCallbackUrl nor
  # returnCallbackUrl -- see ScenarioConfig and RailController. Points
  # nowhere real; every scenario used in anger should set its own
  # callback URL(s) explicitly.
  default-callback-url: http://localhost:8086/rail-callbacks

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
