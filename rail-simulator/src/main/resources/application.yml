server:
  port: 8085

spring:
  application:
    name: rail-simulator

railsim:
  # Used only when a scenario's own callbackUrl is absent -- see
  # ScenarioConfig.callbackUrl() and RailController. Points nowhere real;
  # every scenario used in anger should set its own callbackUrl explicitly.
  default-callback-url: http://localhost:8086/rail-callbacks

management:
  endpoints:
    web:
      exposure:
        include: health,info
