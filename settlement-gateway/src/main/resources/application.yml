server:
  port: 8083

spring:
  application:
    name: settlement-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/payments?stringtype=unspecified
    username: payments
    password: payments
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (core's migrations plus this service's own V2__dispatch_record.sql)
      # is the sole owner of the schema.
      ddl-auto: none
  flyway:
    enabled: true
    # `schemas: gateway` puts this service's own flyway_schema_history in
    # its own schema rather than the shared `public` default -- see
    # intake-service's application.yml for the full reasoning (the V2
    # collision this fixes) and .notes/reports/CROSS-SERVICE-INTEGRATION-DEFECTS.md.
    # This service's actual tables (dispatch_record, reconciliation_state)
    # deliberately stay in `core`, not `gateway` -- they extend the shared
    # instruction lifecycle core.payment_instruction already owns, and
    # moving them was judged out of scope for what this fix needed to
    # change. `gateway` exists solely to give this service's own migration
    # history somewhere that isn't `public`.
    schemas: gateway
    # See intake-service's application.yml for the full reasoning: harmless
    # when not needed, and defends this service too against the same class
    # of shared-schema start-order race if one is ever introduced here.
    baseline-on-migrate: true

payments:
  kafka:
    bootstrap-servers: localhost:29092
    consumer-group: settlement-gateway
    routed-partitions: 12
    dlq-topic: payments.dlq
    dlq-partitions: 3
  outbox:
    batch-size: 100
    # payments.routed is here even though this service didn't originally
    # produce to it (processing-service's RoutingConsumer does): Phase 7's
    # AmbiguityResolver redispatches by writing the same InstructionRouted
    # event this service's own RoutedConsumer already knows how to consume.
    known-topics: payments.sent,payments.settled,payments.exceptions,payments.routed
    retention: 7d
    retention-batch-size: 1000
  gateway:
    # Every rail this gateway knows how to reach, and the base URL it lives
    # at. In this environment all three rails are the same rail-simulator
    # instance, differentiated only by the {railId} path segment -- but the
    # config shape supports each rail genuinely living somewhere different,
    # which is the point of keying by rail id rather than hardcoding one URL.
    rail-base-urls:
      FEDWIRE: http://localhost:8085
      SEPA: http://localhost:8085
      ACH_EQUIV: http://localhost:8085
    connect-timeout: 2s
    read-timeout: 10s
    # Rail dispatch retry on a 5xx (ARCHITECTURE.md section 6.2): five
    # attempts total, 1s/2s/4s/8s/16s backoff, then EXCEPTION -- not
    # payments.dlq, since the outcome is fully known within this one
    # message's processing, not an escaped/unknown failure.
    dispatch-retry:
      max-attempts: 5
      initial-backoff: 1s
      backoff-multiplier: 2.0
    # Phase 7 ambiguity resolution (.notes/ARCHITECTURE.md §6.4,
    # .notes/reports/PHASE-7-REPORT.md §5 for the reasoning behind these
    # numbers). consecutive-unknown-threshold is the phase brief's "two
    # consecutive UNKNOWN observations" rule; the other numbers are this
    # implementation's own judgment calls, made configurable rather than
    # hardcoded so they are visible, documented decisions.
    reconciliation:
      # ISO-8601, not the "2m" shorthand the other Duration properties on
      # this page use -- this value also feeds @Scheduled's fixedDelayString
      # on AmbiguityResolver.reconcile(), and Spring's own scheduling
      # annotation parses only a plain millisecond long or ISO-8601, not
      # Boot's DurationStyle shorthand.
      interval: PT2M
      grace-period: 30s
      batch-size: 50
      consecutive-unknown-threshold: 2
      inconclusive-window: 10
      max-redispatch-attempts: 3
      pending-threshold: 5m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
