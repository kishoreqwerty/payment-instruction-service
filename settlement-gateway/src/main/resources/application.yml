server:
  port: 8083

spring:
  application:
    name: settlement-gateway
  datasource:
    url: jdbc:postgresql://localhost:5432/payments?stringtype=unspecified
    username: payments
    password: payments
  jpa:
    open-in-view: false
    hibernate:
      # Flyway (core's migrations plus this service's own V2__dispatch_record.sql)
      # is the sole owner of the schema.
      ddl-auto: none
  flyway:
    enabled: true

payments:
  kafka:
    bootstrap-servers: localhost:29092
    consumer-group: settlement-gateway
    routed-partitions: 12
    dlq-topic: payments.dlq
    dlq-partitions: 3
  outbox:
    batch-size: 100
    known-topics: payments.sent,payments.settled,payments.exceptions
    retention: 7d
    retention-batch-size: 1000
  gateway:
    # Every rail this gateway knows how to reach, and the base URL it lives
    # at. In this environment all three rails are the same rail-simulator
    # instance, differentiated only by the {railId} path segment -- but the
    # config shape supports each rail genuinely living somewhere different,
    # which is the point of keying by rail id rather than hardcoding one URL.
    rail-base-urls:
      FEDWIRE: http://localhost:8085
      SEPA: http://localhost:8085
      ACH_EQUIV: http://localhost:8085
    connect-timeout: 2s
    read-timeout: 10s
    # Rail dispatch retry on a 5xx (ARCHITECTURE.md section 6.2): five
    # attempts total, 1s/2s/4s/8s/16s backoff, then EXCEPTION -- not
    # payments.dlq, since the outcome is fully known within this one
    # message's processing, not an escaped/unknown failure.
    dispatch-retry:
      max-attempts: 5
      initial-backoff: 1s
      backoff-multiplier: 2.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
