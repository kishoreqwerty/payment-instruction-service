name: Build

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # GitHub-hosted ubuntu-latest runners ship Docker Engine pre-installed
      # with the daemon already running (github.com/actions/runner-images),
      # so Testcontainers can talk to it directly over the Docker socket to
      # start its own Postgres/Redpanda containers per test class, exactly
      # as it does locally. No `services:` block and no explicit daemon
      # start needed here -- `services:` is for a container that runs
      # alongside the job's steps for the job's whole duration, which is a
      # different pattern from what Testcontainers does (it starts and
      # tears down its own containers from inside the test JVM).

      # Root-level `mvn clean verify`, deliberately never with `-pl`: a
      # partial `-pl <module> -am` build never runs an upstream module's own
      # `package` phase, which is exactly what hid Phase 6's real packaging
      # bug -- rail-simulator's Spring Boot repackage execution silently
      # overwrote the plain jar with an executable one that settlement-
      # gateway (a test-scope dependency on rail-simulator) could not
      # compile against, fixed with <classifier>exec</classifier> (see
      # README's "Note: rail-simulator's packaged jar and why it has a
      # classifier"). Only a full-reactor build exercises every module's
      # own packaging the way this one does. If this step is ever changed
      # to add `-pl` "to speed it up", that coverage is gone again,
      # silently -- don't.
      #
      # No pre-verify Docker cleanup here, unlike the sequence documented
      # in README ("Running the tests"): that step exists to guard against
      # a stale Testcontainers/compose stack left over from an earlier
      # local session on a machine that has been running this repo's tests
      # for a while. A GitHub-hosted runner is a fresh VM for every job --
      # there is no earlier session and nothing to clean up, so running it
      # here would just be a no-op every time. Skipped deliberately, not
      # forgotten.
      #
      # -B for non-interactive/log-friendly output. No -q (would hide which
      # test failed) and no -DskipTests, ever.
      - name: mvn clean verify (full reactor)
        run: mvn -B clean verify

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Maven test results
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit

      - name: Upload surefire/failsafe reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  # Not part of the Maven reactor (ops-dashboard/pom.xml doesn't exist -- it's
  # a separate npm project, per its own phase brief), so it gets its own job
  # rather than a step bolted onto `build`. Parallel to `build`, not
  # `needs: build`: the two are independent artifacts with no build-order
  # dependency between them, and serialising them would only add wall-clock
  # time for no correctness benefit.
  ops-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ops-dashboard
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ops-dashboard/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Also independent of `build` (own language, own toolchain, no build-order
  # dependency), same pattern as `ops-dashboard` above. Never makes a live
  # Anthropic API call: `run_evaluation.py` (the piece that does) is a
  # manually-invoked, human-in-the-loop step per .notes/reports/PHASE-11
  # -REPORT.md section 5, run when iterating on the prompt or refreshing the
  # committed baseline -- not something CI should re-run, re-bill, and risk
  # reintroducing sampling variance into on every push. What CI checks
  # instead is (1) the metrics/gate logic itself via pytest, including a
  # synthetic proof that the gate actually fails on a degraded run (see
  # tests/test_gate.py), and (2) that the currently-committed
  # reports/baseline_holdout.json still clears gate.yaml's absolute kappa
  # floor -- so a future commit that replaces the baseline with a worse one
  # is caught here, not just noticed later by a human reading the report.
  evaluation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: evaluation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run harness unit tests
        run: python -m pytest tests/ -v

      - name: Check committed baseline against the regression gate
        run: python check_gate.py --candidate reports/baseline_holdout.json --config gate.yaml
